name: E2E

# Two jobs, and the distinction between them is the whole design:
#
#   "E2E shard (1|2|3)"        — the work. Three runners, each with its OWN
#                                Supabase stack, each running one third of the
#                                Chromium suite via Playwright --shard.
#                                NOT wired to branch protection.
#
#   "Playwright E2E (seeded DB)" — REQUIRED gate. Does no testing itself: it
#                                depends on all three shards and fails unless
#                                every one of them succeeded. This job exists so
#                                the required check NAME is unchanged by
#                                sharding, and branch protection needs no edit.
#
# WHY THE NAME MATTERS. Branch protection pins three contexts by exact string:
# "Lint + typecheck + test", "DB-gated tests (RLS isolation, seeded DB)" and
# "Playwright E2E (seeded DB)". A check context IS the job's `name`. Sharding the
# old job directly would have renamed it to "Playwright E2E (seeded DB) (1)" and
# friends, the required context would never report, and every PR would hang
# forever waiting for a check that no longer exists. The aggregate job carries
# the old name so that cannot happen.
#
# WHY SHARDING PAYS. The suite is deliberately serial — playwright.config.ts sets
# fullyParallel:false and workers:1 because concurrent logins churn the dev
# server's upstream Supabase Auth connections into intermittent ECONNRESET. That
# is environment flakiness, not test flakiness, and it means the only safe way to
# parallelise is MORE MACHINES, not more workers on one machine. Measured on
# #770 (run 30897339154): 2m44s of fixed setup, then 10m33s inside Playwright,
# 13m21s total. Three shards trade two extra runners for roughly half the
# wall-clock on every code PR in the wave.
#
# SETUP RUNS IN EVERY SHARD, AND THAT IS NOT AN ASSUMPTION. Verified in the
# pinned Playwright 1.60.0 source at runner/index.js:2443-2465: the shard filter
# iterates rootSuite.suites, which by construction holds TOP-LEVEL projects only;
# dependency projects are prepended afterwards from the unfiltered project suite.
# So a `dependencies: ["setup"]` project re-runs its setup in full on every
# shard, and each shard authenticates against its own Supabase.
#
# That is also why the Playwright invocation below passes `--project=chromium`
# ALONE where it used to pass `--project=setup --project=chromium`. Naming setup
# explicitly promotes it to a top-level project, which puts its tests INTO the
# shard filter — the one arrangement in which a shard could legitimately receive
# zero setup tests. Dropping the flag is behaviour-neutral today (chromium
# already declares setup as a dependency) and removes that whole class of bug.
#
# Retries are untouched: no --retries flag is passed on pull_request, so the
# config's `retries: CI ? 2 : 0` still governs the gate. The workflow_dispatch
# proving-run inputs behave exactly as PL-30 built them.
#
# Each shard detects docs-only PRs and skips its own Supabase stack, exactly as
# the single job did. Skip semantics are unchanged on purpose: shards always RUN
# and always report success, so the aggregate can demand a strict `success` and
# treat anything else — including `skipped` — as red. An aggregate that accepted
# `skipped` would go green if a future edit ever skipped the shards for the wrong
# reason, which is the failure mode this repo has already been bitten by.

on:
  pull_request:
    branches: [main]
  # PL-30: manual proving runs. A quarantined test can only be un-quarantined on
  # evidence (#739: two consecutive green runs at --retries=0), and that evidence
  # was impossible to gather while the skip was unconditional and the gate ran
  # only on PRs with retries=2. These inputs make the exit condition executable
  # without weakening the required gate, which is untouched.
  workflow_dispatch:
    inputs:
      grep:
        description: "Playwright --grep filter (blank = whole suite)"
        required: false
        default: ""
      retries:
        description: "Retry count. Use 0 for a proving run - retries MASK the race being tested."
        required: false
        default: "0"
      unquarantine:
        description: "Set 1 to run CI-quarantined tests (E2E_UNQUARANTINE)"
        required: false
        default: ""

jobs:
  # -------------------------------------------------------------------------
  # THE WORK — three shards, three Supabase stacks. Not a required check.
  # -------------------------------------------------------------------------
  shard:
    name: E2E shard
    runs-on: ubuntu-latest
    # ================================================================= //
    # THE JOB CEILING IS A BACKSTOP, NOT THE MECHANISM. Raised 25 -> 35 on
    # 2026-08-19 together with the per-step budgets below, and it is only safe
    # to raise BECAUSE of them.
    #
    # WHY IT WAS RAISED. At 25 the ceiling was doing the work a step timeout
    # should do, and doing it blind. Measured across 23 real shard runs the
    # median is 7.6 minutes and the tests themselves take 4-5; the slowest run
    # that SURVIVED took 24.2, which is 48 seconds of margin. Two shards died
    # on the ceiling on 2026-08-19 alone, and neither said why: a hung step
    # emits no error, so the job ends on a bare "The operation was canceled"
    # with the real cause twenty minutes earlier in the log. Both were read as
    # regressions in the change under test before the log was opened.
    #
    # WHY 35 AND NOT MORE. A single hung step now fails at its own budget, at
    # most 16 minutes, which leaves 19 for a run that normally needs 7. So one
    # hang is absorbed AND named. Two independent hangs in one job would still
    # reach the ceiling - that has never been observed, and a ceiling that can
    # never fire is not a backstop.
    timeout-minutes: 35

    strategy:
      # One shard's failure must not cancel the other two: a green sibling is
      # evidence that the failure is local to a shard rather than the stack, and
      # that is the first thing worth knowing when reading the report.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_URL: http://127.0.0.1:54321
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # API app URL used by the portal server actions in E2E (apps/api on port 3002).
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3002
      E2E_ADMIN_EMAIL: e2e-admin@osteojp.test
      E2E_ADMIN_PASSWORD: E2ePassw0rd!
      E2E_THERAPIST_EMAIL: e2e-therapist@osteojp.test
      E2E_THERAPIST_PASSWORD: E2ePassw0rd!
      E2E_RECEPTION_EMAIL: e2e-reception@osteojp.test
      E2E_RECEPTION_PASSWORD: E2ePassw0rd!
      E2E_PORTAL_PATIENT_EMAIL: e2e-patient@osteojp.test
      E2E_PORTAL_PATIENT_PASSWORD: E2ePassw0rd!

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect whether code files changed
        id: changes
        run: |
          # A manual (workflow_dispatch) run has no pull_request context, so the
          # base/head shas below are EMPTY and the docs-only heuristic would mark
          # the run as docs-only and skip all 16 gated steps - i.e. the proving
          # runs PL-30 added this trigger for would silently do nothing and
          # report success. Force code=true for manual runs; they are only ever
          # started deliberately.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run - forcing code=true."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"
          echo "$CHANGED"
          NON_DOC=$(echo "$CHANGED" | grep -vE '^(docs/|.*\.(md|excalidraw)$)' || true)
          if [ -z "$NON_DOC" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip — docs-only PR
        if: steps.changes.outputs.code == 'false'
        run: echo "No code changes detected. E2E tests not required for this PR."

      - name: Set up pnpm
        if: steps.changes.outputs.code == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: Set up Node.js
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # Normally 11-12s (measured, jobs 96112495496 / 96120746039 / 96120746113).
      # The budget is an order of magnitude over that because the registry is the
      # variable, not the work.
      - name: Install dependencies
        if: steps.changes.outputs.code == 'true'
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile

      # Restore the Next.js webpack build cache for the three dev servers Playwright
      # boots (web:3000, api:3002, portal:3001). `next dev` compiles routes lazily,
      # cold, on first request — the single biggest chunk of the "Run Playwright
      # E2E" step. A warm .next/cache lets SWC/webpack reuse module transforms
      # instead of recompiling from scratch, cutting first-response latency across
      # every route the suite visits. This is a COMPILE cache only: the emitted
      # output is byte-identical whether restored or rebuilt, and Next.js auto-
      # invalidates it on a version/config mismatch — so E2E determinism is
      # unaffected. Keyed per-commit with lockfile + os restore-key fallbacks so a
      # fresh branch still warms from the newest prior run (webpack's cache is
      # incremental, so partial reuse across source changes is expected).
      #
      # The key carries the SHARD because each shard visits a different subset of
      # routes and therefore compiles a different subset of modules. One shared
      # key would mean three concurrent jobs racing to save three different caches
      # under one name: exactly one wins, and the next run warms the other two
      # shards from a cache that never saw their routes.
      - name: Cache Next.js build cache (web + api + portal dev servers)
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: |
            apps/web/.next/cache
            apps/api/.next/cache
            apps/portal/.next/cache
          key: nextcache-e2e-${{ runner.os }}-s${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextcache-e2e-${{ runner.os }}-s${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextcache-e2e-${{ runner.os }}-s${{ matrix.shard }}-
            nextcache-e2e-${{ runner.os }}-

      - name: Resolve pinned Playwright version
        if: steps.changes.outputs.code == 'true'
        id: pw
        working-directory: apps/web
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      # Deliberately NOT sharded: the browser bundle is byte-identical in all
      # three shards, so one shared entry is correct and three would triple the
      # cache footprint for nothing. Concurrent shards racing to save the same key
      # is a logged warning in actions/cache, never a failure.
      - name: Cache Playwright browsers
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # ================================================================= //
      # THE BROWSER INSTALL IS BUDGETED AND RETRIED. It killed a shard on
      # 2026-08-19 and the failure was SILENT.
      # ================================================================= //
      # Run 32269074242, shard 3, job 96120745688. The last line this step ever
      # printed, at 15:18:06, was:
      #     Get:5 https://archive.ubuntu.com/ubuntu noble-security InRelease
      # Then nothing at all for twenty-four minutes, until the job ceiling killed
      # it at 15:42:09 with "##[error]The operation was canceled." No error, no
      # cause, no step named. `--with-deps` shells out to apt-get, and apt-get
      # hung against archive.ubuntu.com.
      #
      # THE VARIANCE IS REAL AND THE BUDGET RESPECTS IT. Measured healthy
      # durations for this exact step: 12s (job 96112495496), 47s (96120746039)
      # and 282s (96120746113) - and that last one is shard 2 of THE SAME RUN
      # that hung on shard 3. A tight budget would redden legitimate slow runs,
      # so each attempt gets 7 minutes, roughly 1.5x the slowest healthy case.
      #
      # `timeout` RATHER THAN timeout-minutes ALONE, and the distinction is the
      # whole point: a step killed by timeout-minutes is DEAD, so it cannot
      # retry itself. The inner timeout ends the hung attempt and hands control
      # back to the script, which is what makes a retry possible at all. The
      # step-level budget below remains as the backstop.
      #
      # IT REPORTS ITSELF, like the Supabase fallback beside it. A rescued run
      # prints ::warning:: so it stays visible in the checks UI rather than
      # reading as clean - a silent retry makes a flake un-measurable, which is
      # how the Supabase one reached three occurrences before anyone counted.
      - name: Install Playwright Chromium (+ system deps)
        if: steps.changes.outputs.code == 'true'
        timeout-minutes: 16
        run: |
          set -uo pipefail
          install_browsers() {
            timeout 420 pnpm --filter web exec playwright install --with-deps chromium
          }

          # THE EXIT CODE IS CAPTURED DIRECTLY, NOT AFTER AN `if`. `if cmd; then
          # ...; fi` leaves $? as the status of the IF STATEMENT, which is 0 when
          # the condition was false and no branch ran. Written the obvious way,
          # every failure below would have reported "exited 0 (not a timeout)" -
          # one line mapping four distinct outcomes onto the one that looks
          # harmless, which is the shape PORTAL-REHYDRATE section 1.3 exists for.
          # Verified in a shell before it was relied on.
          install_browsers
          rc=$?
          if [ "$rc" -eq 0 ]; then exit 0; fi

          # 124 is `timeout`'s own "I killed it" code. Anything else is the
          # install genuinely failing, which is a different fact and is said so.
          if [ "$rc" -eq 124 ]; then
            echo "::warning title=Playwright install timed out, retrying once::The browser/system-deps install exceeded 7 minutes and was killed. Almost always apt-get or the Playwright CDN hanging. This run hit CI-shard-timeout-budget-defeats-flaky-retry."
          else
            echo "::warning title=Playwright install failed, retrying once::The install exited ${rc} (not a timeout). Retrying once before calling it real."
          fi

          echo "----- apt lock holders, if any -----"
          sudo lsof /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock 2>/dev/null || echo "(no apt locks held)"
          echo "----- playwright browser cache -----"
          ls -la ~/.cache/ms-playwright 2>/dev/null || echo "(no browser cache - this attempt had to download)"

          # SECOND AND LAST ATTEMPT, matching the Supabase start below: two
          # failures in a row is not a flake, and a third attempt would burn CI
          # minutes while reporting nothing new.
          install_browsers
          rc=$?
          if [ "$rc" -eq 0 ]; then exit 0; fi
          echo "::error title=Playwright install unavailable::Two attempts failed (last exit ${rc}). This is infrastructure, not the change under test."
          exit 1

      # ================================================================= //
      # THE CLI INSTALL IS RETRIED, AND A RETRY IS ANNOUNCED RATHER THAN HIDDEN.
      # ================================================================= //
      # TWO OF THE THREE 2026-08-12 FLAKES DIED HERE, AND THE LOG NAMES THE
      # CAUSE. Run 31622714249, verbatim:
      #     Unexpected HTTP response: 503
      #     Waiting 17 seconds before trying again
      #     socket hang up
      #     Waiting 14 seconds before trying again
      #     ##[error]socket hang up
      # supabase/setup-cli ALREADY retries twice with backoff and still lost: the
      # release CDN was down for longer than its internal budget. Run 31635017752
      # failed identically on shard 1. The CLI version was already pinned, so
      # "pin the version" - the card's first guess - was already true and was
      # never the cause.
      #
      # continue-on-error on the action, then a fallback that installs the SAME
      # PINNED version straight from the GitHub release with its own backoff. No
      # new vendor and no new action: it is the same artifact the action fetches.
      #
      # IT FAILS LOUD AND IT REPORTS ITSELF. If the fallback also loses, the step
      # exits non-zero, because a CLI that will not install is a real red. And
      # when the fallback DOES rescue a run it prints ::warning::, so a run that
      # needed rescuing stays VISIBLE in the checks UI instead of reading as
      # clean. A silent retry would make this flake un-measurable, which is how
      # it reached three occurrences before anyone counted them.
      # Normally 3s. The budget exists because this step's known failure mode is
      # a CDN that is DOWN rather than slow, and the action retries internally -
      # so without a ceiling its retries can outlast the job.
      - name: Set up Supabase CLI
        id: supabase_cli
        if: steps.changes.outputs.code == 'true'
        continue-on-error: true
        timeout-minutes: 6
        uses: supabase/setup-cli@v1
        with:
          version: v2.107.0

      - name: Set up Supabase CLI (fallback, direct release download)
        if: steps.changes.outputs.code == 'true' && steps.supabase_cli.outcome == 'failure'
        timeout-minutes: 6
        env:
          CLI_VERSION: v2.107.0
        run: |
          set -euo pipefail
          echo "::warning title=Supabase CLI action failed::supabase/setup-cli@v1 did not install the CLI. Falling back to a direct release download. This run hit CI-supabase-cli-setup-flaky."
          url="https://github.com/supabase/cli/releases/download/${CLI_VERSION}/supabase_linux_amd64.tar.gz"
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o /tmp/supabase.tar.gz "$url"; then
              tar -xzf /tmp/supabase.tar.gz -C /tmp
              sudo install -m 0755 /tmp/supabase /usr/local/bin/supabase
              supabase --version
              exit 0
            fi
            echo "fallback download attempt ${attempt} failed"
            sleep $((attempt * 10))
          done
          echo "::error title=Supabase CLI unavailable::supabase/setup-cli@v1 and three direct download attempts all failed. This is infrastructure, not the change under test."
          exit 1

      # ================================================================= //
      # THE START IS RETRIED ONCE, AFTER CLEANING UP WHAT BLOCKED IT.
      # ================================================================= //
      # THE THIRD FLAKE DIED HERE, AND IT IS A DIFFERENT CAUSE FROM THE OTHER
      # TWO - which the card had listed as one of three guesses, unresolved.
      # Run 31647425292, verbatim:
      #     failed to start docker container "supabase_db_OsteoJP": Error response
      #     from daemon: failed to set up container networking: driver failed
      #     programming external connectivity on endpoint supabase_db_OsteoJP:
      #     failed to bind host port for 0.0.0.0:54322:172.18.0.2:5432/tcp:
      #     address already in use
      # A port collision, not a download. A half-started stack leaves containers
      # behind holding their published ports, and `supabase stop` clears them.
      #
      # THE DIAGNOSTIC RUNS BEFORE THE CLEANUP, ON PURPOSE. A fourth occurrence
      # must name its own cause instead of costing another archaeology session:
      # `ss -ltnp` says WHAT holds the port and `docker ps -a` says whether a
      # container is already there. Cleaning up first would erase the evidence,
      # which is the mistake that makes an intermittent failure permanent.
      #
      # EACH ATTEMPT IS BUDGETED, ADDED 2026-08-19, AND THE FOURTH OCCURRENCE IS
      # WHY. Run 32263942836 shard 3, job 96103690200: the FIRST `supabase start`
      # hung for roughly twenty-two minutes before failing, the retry below then
      # succeeded, Playwright started at 14:51:02 - and the job's ceiling expired
      # 0.7 seconds later. THE MITIGATION WORKED AND THE JOB DIED ANYWAY, because
      # the retry cost more than the budget had left.
      #
      # A retry that cannot fit in the time remaining is not a mitigation. The
      # inner `timeout` is what makes it fit: a normal start takes 77-93s
      # (measured), so 5 minutes is over 3x headroom, and a hang is cut off with
      # 30 minutes of job budget still unspent instead of 2.
      - name: Start Supabase (lean stack)
        if: steps.changes.outputs.code == 'true'
        timeout-minutes: 12
        run: |
          set -uo pipefail
          LEAN="analytics,vector,studio,realtime,storage,imgproxy,edge-runtime,functions,inbucket,meta"
          if timeout 300 supabase start -x "$LEAN"; then exit 0; fi

          echo "::warning title=Supabase start failed, retrying once::This run hit CI-supabase-cli-setup-flaky. The diagnostics below name the cause; do not dismiss them as noise."
          echo "----- what is listening on 54321-54324 -----"
          ss -ltnp 2>/dev/null | grep -E ":5432[1-4]\b" || echo "(nothing listening on 54321-54324)"
          echo "----- docker containers, including exited -----"
          docker ps -a --format '{{.Names}}\t{{.Status}}\t{{.Ports}}' || true

          echo "----- stopping any partial stack, then retrying -----"
          supabase stop --no-backup || true
          leftovers="$(docker ps -aq --filter 'name=supabase_')"
          if [ -n "$leftovers" ]; then docker rm -f $leftovers || true; fi
          sleep 5

          # SECOND AND LAST ATTEMPT. No loop, deliberately: two failures in a row
          # is not a flake, and retrying past that would burn CI minutes while
          # reporting nothing new about a breakage that is real.
          timeout 300 supabase start -x "$LEAN"

      # Normally 30-31s (measured across three shards).
      - name: Apply migrations + base seed
        if: steps.changes.outputs.code == 'true'
        timeout-minutes: 8
        run: supabase db reset

      - name: Capture Supabase keys for app + seed
        if: steps.changes.outputs.code == 'true'
        run: |
          STATUS="$(supabase status -o json)"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$STATUS" | jq -r '.ANON_KEY')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS" | jq -r '.SERVICE_ROLE_KEY')" >> "$GITHUB_ENV"

      - name: Seed deterministic E2E fixture
        if: steps.changes.outputs.code == 'true'
        run: node apps/web/e2e/seed/seed-e2e.mjs

      # Write apps/portal/.env.local so Next.js's DefinePlugin inlines
      # NEXT_PUBLIC_API_URL at compile time. Without this file the portal dev
      # server has no .env source for the variable and apiBase() compiles to ''.
      # PORTAL_TENANT_ID IS THE SECOND LINE, AND ITS ABSENCE WAS A COVERAGE HOLE
      # RATHER THAN A BUG. apps/portal/lib/auth/otp.ts:54-57 reads it and THROWS
      # without it - deliberately and loudly, per PG7. So the portal's OTP login
      # could not work in CI at all, and NO TEST NOTICED, because every portal
      # spec signed in through the trusted-device door instead. Decision D's
      # PRIMARY patient login had zero e2e coverage by construction: there was
      # nothing to un-skip, the coverage was never possible in this config.
      # See SEC-otp-login-path-has-zero-e2e-coverage. The value is TENANT_A, the
      # same id fixtures.ts:8 already pins.
      - name: Write portal .env.local for E2E
        if: steps.changes.outputs.code == 'true'
        run: |
          {
            echo "NEXT_PUBLIC_API_URL=http://localhost:3002"
            echo "PORTAL_TENANT_ID=00000000-0000-0000-0000-0000000000a1"
          } > apps/portal/.env.local

      - name: Run Playwright E2E (Chromium, shard ${{ matrix.shard }}/3)
        id: playwright
        if: steps.changes.outputs.code == 'true'
        env:
          E2E_UNQUARANTINE: ${{ github.event.inputs.unquarantine }}
        run: |
          # --project=chromium only. setup arrives as its declared dependency and
          # therefore runs UNSHARDED in every shard; see the header note and
          # Playwright 1.60.0 runner/index.js:2443-2465.
          ARGS="--project=chromium --shard=${{ matrix.shard }}/3"
          if [ -n "${{ github.event.inputs.grep }}" ]; then ARGS="$ARGS --grep=${{ github.event.inputs.grep }}"; fi
          if [ -n "${{ github.event.inputs.retries }}" ]; then ARGS="$ARGS --retries=${{ github.event.inputs.retries }}"; fi
          pnpm --filter web exec playwright test $ARGS

      # SKIP-GUARD. Playwright counts a skip as "not a failure", so a
      # gate-bearing test that never ran leaves a GREEN shard, a green aggregate
      # and a satisfied branch protection. PG8's direction A skipped green on two
      # consecutive runs and #879 merged on it. This is the E2E analogue of
      # assert-rls-executed.mjs and it runs on EVERY shard.
      #
      # `if: always()` on purpose: when the suite fails the report still exists,
      # and a hard-required test that SKIPPED during a failing run is a second,
      # separate finding that must not be hidden by the first.
      # GATED ON PLAYWRIGHT HAVING ACTUALLY RUN, AND THAT IS A CORRECTION.
      # The first version used `if: always() && steps.changes.outputs.code ==
      # 'true'`. On run 31622714249 the "Set up Supabase CLI" step FAILED, so
      # every downstream step skipped - including Playwright - and this guard,
      # being `always()`, ran anyway, found no report, and announced
      # "E2E SKIP-GUARD RED" for what was a Supabase CLI infrastructure failure.
      # IT REPORTED THE WRONG CAUSE, which is the exact class of defect it was
      # built to catch, in itself.
      #
      # `conclusion` is 'success' or 'failure' only if the step RAN. It is
      # 'skipped' otherwise. So the guard now runs after a Playwright PASS or a
      # Playwright FAIL - a test that skipped inside a FAILING run is still a
      # separate finding and must not be hidden - and stays silent when
      # Playwright never executed at all, where it has nothing to say.
      - name: Assert hard-required E2E tests actually ran
        if: always() && (steps.playwright.conclusion == 'success' || steps.playwright.conclusion == 'failure')
        run: node .github/scripts/assert-e2e-executed.mjs apps/web/e2e-results.json .

      # upload-artifact@v4 rejects a duplicate name outright, so the shard is part
      # of the name rather than a nicety. Three separate reports also mean the
      # failing shard's report is the one you open, named after the job that went
      # red.
      - name: Upload Playwright report (Chromium, shard ${{ matrix.shard }})
        if: steps.changes.outputs.code == 'true' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium-shard-${{ matrix.shard }}
          # test-results carries PG9's mobile screenshots (pg9-*.png, 390x844,
          # full page) alongside Playwright's own failure captures. Uploaded
          # rather than committed: a screenshot in git goes stale the day after
          # it is taken and nobody notices, while an artifact is always OF THE
          # RUN whose verdict sits beside it.
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # -------------------------------------------------------------------------
  # THE REQUIRED GATE — name pinned by branch protection. Runs no tests.
  # -------------------------------------------------------------------------
  playwright:
    name: Playwright E2E (seeded DB)
    needs: [shard]
    # always() is load-bearing. Without it this job is SKIPPED the moment any
    # shard fails, the required context never reports a conclusion, and the PR
    # waits forever on a check that will never arrive. With it, a failed shard
    # produces a RED required check, which is the point.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify every shard passed
        run: |
          # `needs.shard.result` is the matrix's AGGREGATE result: "success" only
          # when all three legs succeeded. Anything else - failure, cancelled, or
          # skipped - is red. Skipped is deliberately NOT treated as success: the
          # shards have no job-level `if`, so a skip would mean something changed
          # that nobody reasoned about, and a gate that goes green on an
          # unexplained skip is not a gate.
          RESULT="${{ needs.shard.result }}"
          echo "Aggregate result of the three E2E shards: $RESULT"
          if [ "$RESULT" != "success" ]; then
            echo "::error::E2E gate RED - shard aggregate result is '$RESULT', expected 'success'. Open the red 'E2E shard (N)' job and read its playwright-report-chromium-shard-N artifact before anything else."
            exit 1
          fi
          echo "All three E2E shards succeeded."
