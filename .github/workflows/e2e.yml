name: E2E

# Two jobs, and the distinction between them is the whole design:
#
#   "E2E shard (1|2|3)"        — the work. Three runners, each with its OWN
#                                Supabase stack, each running one third of the
#                                Chromium suite via Playwright --shard.
#                                NOT wired to branch protection.
#
#   "Playwright E2E (seeded DB)" — REQUIRED gate. Does no testing itself: it
#                                depends on all three shards and fails unless
#                                every one of them succeeded. This job exists so
#                                the required check NAME is unchanged by
#                                sharding, and branch protection needs no edit.
#
# WHY THE NAME MATTERS. Branch protection pins three contexts by exact string:
# "Lint + typecheck + test", "DB-gated tests (RLS isolation, seeded DB)" and
# "Playwright E2E (seeded DB)". A check context IS the job's `name`. Sharding the
# old job directly would have renamed it to "Playwright E2E (seeded DB) (1)" and
# friends, the required context would never report, and every PR would hang
# forever waiting for a check that no longer exists. The aggregate job carries
# the old name so that cannot happen.
#
# WHY SHARDING PAYS. The suite is deliberately serial — playwright.config.ts sets
# fullyParallel:false and workers:1 because concurrent logins churn the dev
# server's upstream Supabase Auth connections into intermittent ECONNRESET. That
# is environment flakiness, not test flakiness, and it means the only safe way to
# parallelise is MORE MACHINES, not more workers on one machine. Measured on
# #770 (run 30897339154): 2m44s of fixed setup, then 10m33s inside Playwright,
# 13m21s total. Three shards trade two extra runners for roughly half the
# wall-clock on every code PR in the wave.
#
# SETUP RUNS IN EVERY SHARD, AND THAT IS NOT AN ASSUMPTION. Verified in the
# pinned Playwright 1.60.0 source at runner/index.js:2443-2465: the shard filter
# iterates rootSuite.suites, which by construction holds TOP-LEVEL projects only;
# dependency projects are prepended afterwards from the unfiltered project suite.
# So a `dependencies: ["setup"]` project re-runs its setup in full on every
# shard, and each shard authenticates against its own Supabase.
#
# That is also why the Playwright invocation below passes `--project=chromium`
# ALONE where it used to pass `--project=setup --project=chromium`. Naming setup
# explicitly promotes it to a top-level project, which puts its tests INTO the
# shard filter — the one arrangement in which a shard could legitimately receive
# zero setup tests. Dropping the flag is behaviour-neutral today (chromium
# already declares setup as a dependency) and removes that whole class of bug.
#
# Retries are untouched: no --retries flag is passed on pull_request, so the
# config's `retries: CI ? 2 : 0` still governs the gate. The workflow_dispatch
# proving-run inputs behave exactly as PL-30 built them.
#
# Each shard detects docs-only PRs and skips its own Supabase stack, exactly as
# the single job did. Skip semantics are unchanged on purpose: shards always RUN
# and always report success, so the aggregate can demand a strict `success` and
# treat anything else — including `skipped` — as red. An aggregate that accepted
# `skipped` would go green if a future edit ever skipped the shards for the wrong
# reason, which is the failure mode this repo has already been bitten by.

on:
  pull_request:
    branches: [main]
  # PL-30: manual proving runs. A quarantined test can only be un-quarantined on
  # evidence (#739: two consecutive green runs at --retries=0), and that evidence
  # was impossible to gather while the skip was unconditional and the gate ran
  # only on PRs with retries=2. These inputs make the exit condition executable
  # without weakening the required gate, which is untouched.
  workflow_dispatch:
    inputs:
      grep:
        description: "Playwright --grep filter (blank = whole suite)"
        required: false
        default: ""
      retries:
        description: "Retry count. Use 0 for a proving run - retries MASK the race being tested."
        required: false
        default: "0"
      unquarantine:
        description: "Set 1 to run CI-quarantined tests (E2E_UNQUARANTINE)"
        required: false
        default: ""

jobs:
  # -------------------------------------------------------------------------
  # THE WORK — three shards, three Supabase stacks. Not a required check.
  # -------------------------------------------------------------------------
  shard:
    name: E2E shard
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      # One shard's failure must not cancel the other two: a green sibling is
      # evidence that the failure is local to a shard rather than the stack, and
      # that is the first thing worth knowing when reading the report.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_URL: http://127.0.0.1:54321
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # API app URL used by the portal server actions in E2E (apps/api on port 3002).
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3002
      E2E_ADMIN_EMAIL: e2e-admin@osteojp.test
      E2E_ADMIN_PASSWORD: E2ePassw0rd!
      E2E_THERAPIST_EMAIL: e2e-therapist@osteojp.test
      E2E_THERAPIST_PASSWORD: E2ePassw0rd!
      E2E_RECEPTION_EMAIL: e2e-reception@osteojp.test
      E2E_RECEPTION_PASSWORD: E2ePassw0rd!
      E2E_PORTAL_PATIENT_EMAIL: e2e-patient@osteojp.test
      E2E_PORTAL_PATIENT_PASSWORD: E2ePassw0rd!

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect whether code files changed
        id: changes
        run: |
          # A manual (workflow_dispatch) run has no pull_request context, so the
          # base/head shas below are EMPTY and the docs-only heuristic would mark
          # the run as docs-only and skip all 16 gated steps - i.e. the proving
          # runs PL-30 added this trigger for would silently do nothing and
          # report success. Force code=true for manual runs; they are only ever
          # started deliberately.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run - forcing code=true."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"
          echo "$CHANGED"
          NON_DOC=$(echo "$CHANGED" | grep -vE '^(docs/|.*\.(md|excalidraw)$)' || true)
          if [ -z "$NON_DOC" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip — docs-only PR
        if: steps.changes.outputs.code == 'false'
        run: echo "No code changes detected. E2E tests not required for this PR."

      - name: Set up pnpm
        if: steps.changes.outputs.code == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: Set up Node.js
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      # Restore the Next.js webpack build cache for the three dev servers Playwright
      # boots (web:3000, api:3002, portal:3001). `next dev` compiles routes lazily,
      # cold, on first request — the single biggest chunk of the "Run Playwright
      # E2E" step. A warm .next/cache lets SWC/webpack reuse module transforms
      # instead of recompiling from scratch, cutting first-response latency across
      # every route the suite visits. This is a COMPILE cache only: the emitted
      # output is byte-identical whether restored or rebuilt, and Next.js auto-
      # invalidates it on a version/config mismatch — so E2E determinism is
      # unaffected. Keyed per-commit with lockfile + os restore-key fallbacks so a
      # fresh branch still warms from the newest prior run (webpack's cache is
      # incremental, so partial reuse across source changes is expected).
      #
      # The key carries the SHARD because each shard visits a different subset of
      # routes and therefore compiles a different subset of modules. One shared
      # key would mean three concurrent jobs racing to save three different caches
      # under one name: exactly one wins, and the next run warms the other two
      # shards from a cache that never saw their routes.
      - name: Cache Next.js build cache (web + api + portal dev servers)
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: |
            apps/web/.next/cache
            apps/api/.next/cache
            apps/portal/.next/cache
          key: nextcache-e2e-${{ runner.os }}-s${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextcache-e2e-${{ runner.os }}-s${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextcache-e2e-${{ runner.os }}-s${{ matrix.shard }}-
            nextcache-e2e-${{ runner.os }}-

      - name: Resolve pinned Playwright version
        if: steps.changes.outputs.code == 'true'
        id: pw
        working-directory: apps/web
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      # Deliberately NOT sharded: the browser bundle is byte-identical in all
      # three shards, so one shared entry is correct and three would triple the
      # cache footprint for nothing. Concurrent shards racing to save the same key
      # is a logged warning in actions/cache, never a failure.
      - name: Cache Playwright browsers
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright Chromium (+ system deps)
        if: steps.changes.outputs.code == 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Set up Supabase CLI
        if: steps.changes.outputs.code == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: v2.107.0

      - name: Start Supabase (lean stack)
        if: steps.changes.outputs.code == 'true'
        run: >
          supabase start
          -x analytics,vector,studio,realtime,storage,imgproxy,edge-runtime,functions,inbucket,meta

      - name: Apply migrations + base seed
        if: steps.changes.outputs.code == 'true'
        run: supabase db reset

      - name: Capture Supabase keys for app + seed
        if: steps.changes.outputs.code == 'true'
        run: |
          STATUS="$(supabase status -o json)"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$STATUS" | jq -r '.ANON_KEY')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS" | jq -r '.SERVICE_ROLE_KEY')" >> "$GITHUB_ENV"

      - name: Seed deterministic E2E fixture
        if: steps.changes.outputs.code == 'true'
        run: node apps/web/e2e/seed/seed-e2e.mjs

      # Write apps/portal/.env.local so Next.js's DefinePlugin inlines
      # NEXT_PUBLIC_API_URL at compile time. Without this file the portal dev
      # server has no .env source for the variable and apiBase() compiles to ''.
      - name: Write portal .env.local for E2E
        if: steps.changes.outputs.code == 'true'
        run: echo "NEXT_PUBLIC_API_URL=http://localhost:3002" > apps/portal/.env.local

      - name: Run Playwright E2E (Chromium, shard ${{ matrix.shard }}/3)
        if: steps.changes.outputs.code == 'true'
        env:
          E2E_UNQUARANTINE: ${{ github.event.inputs.unquarantine }}
        run: |
          # --project=chromium only. setup arrives as its declared dependency and
          # therefore runs UNSHARDED in every shard; see the header note and
          # Playwright 1.60.0 runner/index.js:2443-2465.
          ARGS="--project=chromium --shard=${{ matrix.shard }}/3"
          if [ -n "${{ github.event.inputs.grep }}" ]; then ARGS="$ARGS --grep=${{ github.event.inputs.grep }}"; fi
          if [ -n "${{ github.event.inputs.retries }}" ]; then ARGS="$ARGS --retries=${{ github.event.inputs.retries }}"; fi
          pnpm --filter web exec playwright test $ARGS

      # upload-artifact@v4 rejects a duplicate name outright, so the shard is part
      # of the name rather than a nicety. Three separate reports also mean the
      # failing shard's report is the one you open, named after the job that went
      # red.
      - name: Upload Playwright report (Chromium, shard ${{ matrix.shard }})
        if: steps.changes.outputs.code == 'true' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium-shard-${{ matrix.shard }}
          path: apps/web/playwright-report
          retention-days: 7

  # -------------------------------------------------------------------------
  # THE REQUIRED GATE — name pinned by branch protection. Runs no tests.
  # -------------------------------------------------------------------------
  playwright:
    name: Playwright E2E (seeded DB)
    needs: [shard]
    # always() is load-bearing. Without it this job is SKIPPED the moment any
    # shard fails, the required context never reports a conclusion, and the PR
    # waits forever on a check that will never arrive. With it, a failed shard
    # produces a RED required check, which is the point.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify every shard passed
        run: |
          # `needs.shard.result` is the matrix's AGGREGATE result: "success" only
          # when all three legs succeeded. Anything else - failure, cancelled, or
          # skipped - is red. Skipped is deliberately NOT treated as success: the
          # shards have no job-level `if`, so a skip would mean something changed
          # that nobody reasoned about, and a gate that goes green on an
          # unexplained skip is not a gate.
          RESULT="${{ needs.shard.result }}"
          echo "Aggregate result of the three E2E shards: $RESULT"
          if [ "$RESULT" != "success" ]; then
            echo "::error::E2E gate RED - shard aggregate result is '$RESULT', expected 'success'. Open the red 'E2E shard (N)' job and read its playwright-report-chromium-shard-N artifact before anything else."
            exit 1
          fi
          echo "All three E2E shards succeeded."
