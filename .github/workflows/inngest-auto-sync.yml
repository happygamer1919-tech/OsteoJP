name: Inngest auto-sync (osteojp-reminders, osteojp-consultation)

# R6, STRATEGY'S RULING OF 2026-10-25: THE APP IS SYNCED BY EVERY PRODUCTION
# DEPLOY, NOT BY A HAND ON A BUTTON.
#
# Until this workflow, the Inngest app osteojp-reminders was synced by the owner
# pressing Resync. A function's CODE followed every deploy; its SETTINGS
# (triggers, cancelOn, idempotency, concurrency) stayed whatever Inngest stored at
# the last press. On 2026-10-07 the last press was 2026-08-03, and three merged
# and deployed changes were not live (CLAUDE.md, "a change to a background job's
# settings is not live at merge").
#
# R27, STRATEGY'S RULING OF 2026-10-30: THE osteojp-consultation APP IS SYNCED
# THE SAME WAY, BY THE SAME RUN, AND NO OTHER APP IS.
#
# The consultation app serves one function, the AI-recording send retry
# (retry-pending-consultation-fires), on a cron of every 2 hours from 08:00 to
# 20:00 Lisbon. It was never synced, so a failed send was never retried. From
# this workflow on it is registered by every production deploy, as the
# reminders app is. Exactly these two apps are synced:
# scripts/inngest-auto-sync-workflow.test.mjs fails on a third.
#
# WHAT IT DOES, after a successful PRODUCTION deployment of osteojp-platform:
#   1. Counts, from the code at the deployed commit, the functions /api/inngest
#      serves (scripts/inngest-expected-functions.mjs), and the functions
#      /api/inngest/consultation serves (the same script, --app
#      osteojp-consultation). Never a constant.
#   2. Waits, at most 10 minutes, until https://app.osteojp.pt/api/inngest/deployed
#      answers with the deployed commit. A sync sent before the domain points at
#      the new deployment would register the OLD functions.
#   3. Sends `PUT https://app.osteojp.pt/api/inngest`. That is the same call the
#      Resync button makes: the app registers its own functions with Inngest,
#      signing the request with its own INNGEST_SIGNING_KEY, which never leaves
#      Vercel. This workflow holds no secret and needs none.
#   4. Checks that the live deployment serves exactly the expected count, under
#      the app id it means, and that Inngest's answer to the registration
#      carries no error.
#   5. For osteojp-consultation: FIRST checks that
#      https://app.osteojp.pt/api/inngest/consultation/deployed answers the
#      deployed commit, the app id osteojp-consultation and the expected count.
#      Only then sends `PUT https://app.osteojp.pt/api/inngest/consultation`, and
#      then checks the same three again. The check before the sync is what
#      keeps a deployment that does not carry that endpoint (one older than
#      R27's schedule change, which ships with it) from registering the old
#      5-minute cron: no endpoint, no sync.
#
# WHAT IT DOES NOT DO, said plainly:
#   - It does not use the Inngest Vercel integration. That integration sets
#     INNGEST_SIGNING_KEY and INNGEST_EVENT_KEY itself, and the event key in use
#     is never rotated (R6).
#   - It does not read what Inngest STORED. An unsigned GET on /api/inngest
#     answers 401 in cloud mode (inngest 4.5.0, InngestCommHandler GET branch),
#     and Inngest's own API needs a key. What it proves is that the deployment
#     it synced serves the expected number of functions, and that Inngest
#     accepted the registration. The dashboard's sync entry is the owner's check
#     on the first run (R6's GATE).
#   - It syncs osteojp-reminders and osteojp-consultation only. The other serve
#     endpoints under /api/inngest/* (invoicexpress, ifthenpay, stripe) are
#     other Inngest apps and are not synced by this workflow (R27).
#   - A failure in the reminders steps stops the run before the consultation
#     steps. The run is red either way, and the owner's Resync is the fallback
#     for each app.
#
# WHICH DEPLOYMENTS: Vercel's GitHub app names the environment
# "Production <dash> osteojp-platform" (read from the deployments API on
# 2026-10-25; the dash is not ASCII, so it is matched by its two ends rather
# than typed here). Preview deployments, and the osteojp-api and osteojp-portal
# projects, are skipped by the `if:` below.
#
# TWO DEPLOYS IN A ROW: the runs queue, one at a time, and a running sync is
# never cancelled. The concurrency group sits on the `sync` JOB, not on the
# workflow: every deployment_status event starts this workflow (previews of the
# api and portal projects, inactive updates), and a workflow-level group with
# cancel-in-progress would let any of them cancel a running production sync
# before its own `if` had even been read. On the job, only runs that pass the
# `if` take the group. With cancel-in-progress false GitHub keeps one sync
# running and at most one waiting; a newer waiting run replaces an older WAITING
# one, which is right: the newer commit is the one worth registering, and the
# run already in progress finishes.

on:
  deployment_status:

permissions:
  contents: read

jobs:
  sync:
    name: Sync osteojp-reminders and osteojp-consultation after a production deploy
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Production') &&
      endsWith(github.event.deployment.environment, 'osteojp-platform')
    concurrency:
      group: inngest-auto-sync
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Above the wait step's own 10-minute deadline plus the sync and the check,
    # so the step's NOT SYNCED line always prints before the job is killed.
    timeout-minutes: 20
    env:
      APP_ORIGIN: https://app.osteojp.pt
      DEPLOYED_SHA: ${{ github.event.deployment.sha }}
    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
          persist-credentials: false

      - name: Count the functions the code serves
        id: expected
        run: |
          node scripts/inngest-expected-functions.mjs --list || { echo "::error::Could not read the served functions from the code at ${DEPLOYED_SHA}."; exit 1; }
          count=$(node scripts/inngest-expected-functions.mjs) || { echo "::error::Could not count the served functions."; exit 1; }
          case "${count}" in
            ''|*[!0-9]*) echo "::error::The count is not a number: '${count}'"; exit 1 ;;
          esac
          echo "Expected from code at ${DEPLOYED_SHA}: ${count} function(s) for osteojp-reminders."
          echo "count=${count}" >> "${GITHUB_OUTPUT}"
          node scripts/inngest-expected-functions.mjs --app osteojp-consultation --list || { echo "::error::Could not read the consultation app's functions from the code at ${DEPLOYED_SHA}."; exit 1; }
          consultation=$(node scripts/inngest-expected-functions.mjs --app osteojp-consultation) || { echo "::error::Could not count the consultation app's functions."; exit 1; }
          case "${consultation}" in
            ''|*[!0-9]*) echo "::error::The consultation count is not a number: '${consultation}'"; exit 1 ;;
          esac
          echo "Expected from code at ${DEPLOYED_SHA}: ${consultation} function(s) for osteojp-consultation."
          echo "consultation_count=${consultation}" >> "${GITHUB_OUTPUT}"

      - name: Wait until app.osteojp.pt serves the deployed commit
        run: |
          # A deadline in elapsed seconds, not a count of attempts: a slow curl
          # (up to 15 s each) cannot stretch the wait past 10 minutes. The two
          # WAIT_* variables are set by nothing in this workflow; only the
          # script test shortens them, to prove the NOT SYNCED path in seconds.
          live=""
          deadline=$(( $(date +%s) + ${WAIT_DEADLINE_SECONDS:-600} ))
          attempt=0
          while [ "$(date +%s)" -lt "${deadline}" ]; do
            attempt=$((attempt + 1))
            body=$(curl -sS --max-time 15 "${APP_ORIGIN}/api/inngest/deployed" 2>/dev/null || true)
            live=$(printf '%s' "${body}" | jq -r '.commit // empty' 2>/dev/null || true)
            if [ "${live}" = "${DEPLOYED_SHA}" ]; then
              echo "Attempt ${attempt}: ${APP_ORIGIN} serves ${DEPLOYED_SHA}."
              exit 0
            fi
            echo "Attempt ${attempt}: live commit is '${live:-unknown}', waiting for ${DEPLOYED_SHA}."
            sleep "${WAIT_SLEEP_SECONDS:-15}"
          done
          echo "::error::After 10 minutes ${APP_ORIGIN} still serves '${live:-unknown}', not ${DEPLOYED_SHA}. NOT SYNCED. If a newer deploy took the domain, its own run syncs it; otherwise the owner presses Resync."
          exit 1

      - name: Sync osteojp-reminders (PUT /api/inngest)
        id: sync
        env:
          SERVE_PATH: /api/inngest
        run: |
          out="${RUNNER_TEMP}/sync-body.json"
          code=$(curl -sS -X PUT "${APP_ORIGIN}${SERVE_PATH}" --fail-with-body --max-time 60 -o "${out}" -w '%{http_code}') || {
            echo "::error::The sync call failed (HTTP ${code:-none}). NOT SYNCED. Body follows."
            cat "${out}" 2>/dev/null || true
            exit 1
          }
          echo "HTTP ${code}. Body:"
          cat "${out}"; echo
          # inngest 4.5.0 (InngestCommHandler, PUT, out-of-band): the body is
          # {message, modified}. `message` is Inngest's `error` field, which
          # defaults to "Successfully registered" on success. A failed
          # registration answers a non-2xx status (caught by --fail-with-body
          # above) or another message, which is a failure here too.
          message=$(jq -r '.message // empty' "${out}") || { echo "::error::The sync answer is not JSON."; exit 1; }
          if [ "${message}" != "Successfully registered" ]; then
            echo "::error::Inngest did not confirm the registration. Its message: '${message:-none}'. NOT SYNCED."
            exit 1
          fi
          modified=$(jq -r '.modified // false' "${out}")
          echo "modified=${modified}" >> "${GITHUB_OUTPUT}"

      - name: Check the live function count against the code (osteojp-reminders)
        env:
          APP_ID: osteojp-reminders
          DEPLOYED_PATH: /api/inngest/deployed
          EXPECTED: ${{ steps.expected.outputs.count }}
          MODIFIED: ${{ steps.sync.outputs.modified }}
        run: |
          body=$(curl -sS --max-time 15 "${APP_ORIGIN}${DEPLOYED_PATH}") || { echo "::error::Could not read ${APP_ORIGIN}${DEPLOYED_PATH} after the sync."; exit 1; }
          live_commit=$(printf '%s' "${body}" | jq -r '.commit // empty') || { echo "::error::Not JSON: ${body}"; exit 1; }
          live_app=$(printf '%s' "${body}" | jq -r '.app // empty') || { echo "::error::Not JSON: ${body}"; exit 1; }
          live_count=$(printf '%s' "${body}" | jq -r '.functionCount // empty') || { echo "::error::Not JSON: ${body}"; exit 1; }
          if [ "${live_commit}" != "${DEPLOYED_SHA}" ]; then
            echo "::error::The domain moved to '${live_commit}' during the sync. This run cannot vouch for what was registered; the newer deploy's run will sync again."
            exit 1
          fi
          if [ "${live_app}" != "${APP_ID}" ]; then
            echo "::error::${DEPLOYED_PATH} names the app '${live_app:-none}', not ${APP_ID}."
            exit 1
          fi
          if [ "${live_count}" != "${EXPECTED}" ]; then
            echo "::error::The live deployment serves ${live_count:-no} function(s); the code at ${DEPLOYED_SHA} lists ${EXPECTED}."
            exit 1
          fi
          {
            echo "### ${APP_ID} synced"
            echo ""
            echo "- Commit: \`${DEPLOYED_SHA}\`"
            echo "- Functions served and registered: ${live_count} (expected from code: ${EXPECTED})"
            echo "- Inngest reported the app modified: ${MODIFIED}"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "Synced ${APP_ID} at ${DEPLOYED_SHA}: ${live_count} function(s), as the code lists. Modified: ${MODIFIED}."

      - name: Check osteojp-consultation is ready to sync
        env:
          APP_ID: osteojp-consultation
          DEPLOYED_PATH: /api/inngest/consultation/deployed
          EXPECTED: ${{ steps.expected.outputs.consultation_count }}
        run: |
          # BEFORE the sync, so a deployment that cannot vouch for this app
          # (no endpoint, another commit, another app, another count) registers
          # nothing. A deployment older than R27's schedule change has no
          # endpoint here, and its 5-minute cron is never registered.
          body=$(curl -sS --fail --max-time 15 "${APP_ORIGIN}${DEPLOYED_PATH}") || { echo "::error::Could not read ${APP_ORIGIN}${DEPLOYED_PATH}. NOT SYNCED: ${APP_ID}."; exit 1; }
          live_commit=$(printf '%s' "${body}" | jq -r '.commit // empty') || { echo "::error::Not JSON: ${body}. NOT SYNCED: ${APP_ID}."; exit 1; }
          live_app=$(printf '%s' "${body}" | jq -r '.app // empty') || { echo "::error::Not JSON: ${body}. NOT SYNCED: ${APP_ID}."; exit 1; }
          live_count=$(printf '%s' "${body}" | jq -r '.functionCount // empty') || { echo "::error::Not JSON: ${body}. NOT SYNCED: ${APP_ID}."; exit 1; }
          if [ "${live_commit}" != "${DEPLOYED_SHA}" ] || [ "${live_app}" != "${APP_ID}" ] || [ "${live_count}" != "${EXPECTED}" ]; then
            echo "::error::${DEPLOYED_PATH} answers commit '${live_commit:-none}', app '${live_app:-none}', ${live_count:-no} function(s); expected ${DEPLOYED_SHA}, ${APP_ID}, ${EXPECTED}. NOT SYNCED: ${APP_ID}."
            exit 1
          fi
          echo "${APP_ID} at ${DEPLOYED_SHA} serves ${live_count} function(s), as the code lists. Syncing."

      - name: Sync osteojp-consultation (PUT /api/inngest/consultation)
        id: sync_consultation
        env:
          SERVE_PATH: /api/inngest/consultation
        run: |
          out="${RUNNER_TEMP}/sync-body.json"
          code=$(curl -sS -X PUT "${APP_ORIGIN}${SERVE_PATH}" --fail-with-body --max-time 60 -o "${out}" -w '%{http_code}') || {
            echo "::error::The sync call failed (HTTP ${code:-none}). NOT SYNCED. Body follows."
            cat "${out}" 2>/dev/null || true
            exit 1
          }
          echo "HTTP ${code}. Body:"
          cat "${out}"; echo
          # inngest 4.5.0 (InngestCommHandler, PUT, out-of-band): the body is
          # {message, modified}. `message` is Inngest's `error` field, which
          # defaults to "Successfully registered" on success. A failed
          # registration answers a non-2xx status (caught by --fail-with-body
          # above) or another message, which is a failure here too.
          message=$(jq -r '.message // empty' "${out}") || { echo "::error::The sync answer is not JSON."; exit 1; }
          if [ "${message}" != "Successfully registered" ]; then
            echo "::error::Inngest did not confirm the registration. Its message: '${message:-none}'. NOT SYNCED."
            exit 1
          fi
          modified=$(jq -r '.modified // false' "${out}")
          echo "modified=${modified}" >> "${GITHUB_OUTPUT}"

      - name: Check the live function count against the code (osteojp-consultation)
        env:
          APP_ID: osteojp-consultation
          DEPLOYED_PATH: /api/inngest/consultation/deployed
          EXPECTED: ${{ steps.expected.outputs.consultation_count }}
          MODIFIED: ${{ steps.sync_consultation.outputs.modified }}
        run: |
          body=$(curl -sS --max-time 15 "${APP_ORIGIN}${DEPLOYED_PATH}") || { echo "::error::Could not read ${APP_ORIGIN}${DEPLOYED_PATH} after the sync."; exit 1; }
          live_commit=$(printf '%s' "${body}" | jq -r '.commit // empty') || { echo "::error::Not JSON: ${body}"; exit 1; }
          live_app=$(printf '%s' "${body}" | jq -r '.app // empty') || { echo "::error::Not JSON: ${body}"; exit 1; }
          live_count=$(printf '%s' "${body}" | jq -r '.functionCount // empty') || { echo "::error::Not JSON: ${body}"; exit 1; }
          if [ "${live_commit}" != "${DEPLOYED_SHA}" ]; then
            echo "::error::The domain moved to '${live_commit}' during the sync. This run cannot vouch for what was registered; the newer deploy's run will sync again."
            exit 1
          fi
          if [ "${live_app}" != "${APP_ID}" ]; then
            echo "::error::${DEPLOYED_PATH} names the app '${live_app:-none}', not ${APP_ID}."
            exit 1
          fi
          if [ "${live_count}" != "${EXPECTED}" ]; then
            echo "::error::The live deployment serves ${live_count:-no} function(s); the code at ${DEPLOYED_SHA} lists ${EXPECTED}."
            exit 1
          fi
          {
            echo "### ${APP_ID} synced"
            echo ""
            echo "- Commit: \`${DEPLOYED_SHA}\`"
            echo "- Functions served and registered: ${live_count} (expected from code: ${EXPECTED})"
            echo "- Inngest reported the app modified: ${MODIFIED}"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "Synced ${APP_ID} at ${DEPLOYED_SHA}: ${live_count} function(s), as the code lists. Modified: ${MODIFIED}."
