name: Auto-update PR branches

# When main moves, bring every open, non-draft PR that is behind main up to
# date automatically, so nobody has to click "Update branch" all day.
#
# IMPORTANT: branch updates made with the default GITHUB_TOKEN do NOT re-trigger
# the PR's CI (GitHub anti-recursion), leaving the PR stuck on "expected" checks
# forever. So this workflow uses a repo secret PAT (AUTO_UPDATE_TOKEN) for the
# API calls, and no-ops safely if that secret is absent.
#
# A PASS THAT COULD NOT DO ITS JOB MUST NOT REPORT SUCCESS. Added 2026-09-06,
# after this workflow spent at least two days failing EVERY update with HTTP 404
# and showing three green ticks on the runs list. The update arm printed the
# failure and continued, nothing set a non-zero exit, and the defect was found
# only because a lane noticed three PRs sitting at BEHIND and went and read the
# logs. That is the same shape as a pre-check whose output the pager ate: the
# instrument answers, the answer is discarded, and the absence of an alarm is
# read as an all-clear.
#
# WHAT THE FAILURE LOOKED LIKE, so the next reader recognises it: the
# `behind main by N commit(s)` line printed correctly on every PR, which means
# the LIST and COMPARE calls succeeded and only `PUT .../update-branch` failed.
#
# THE THREE CALLS AND THE PERMISSION EACH ONE NEEDS:
#     GET  /repos/{owner}/{repo}/pulls                    Pull requests  READ
#     GET  /repos/{owner}/{repo}/compare/{basehead}       Contents       READ
#     PUT  /repos/{owner}/{repo}/pulls/{n}/update-branch  Contents       WRITE
#
# THE THIRD LINE USED TO READ "Pull requests WRITE", AND IT WAS WRONG. Corrected
# 2026-09-18, after the failure changed shape: every run from 2026-09-16 20:24
# onward fails with HTTP 403 and the body
#     {"message": "user doesn't have permission to update head repository"}
# rather than the 404 this comment was originally written against.
#
# "UPDATE HEAD REPOSITORY" IS THE TELL, and it is worth spelling out because the
# endpoint's name invites the wrong guess. `update-branch` does not annotate a
# pull request. GitHub's REST reference says it "Updates the pull request branch
# with the latest upstream changes by MERGING HEAD from the base branch into the
# pull request branch", and the same page adds: "If making a request on behalf of
# a GitHub App you must also have permissions to write the contents of the head
# repository." It creates a merge commit on the head branch. That is a CONTENTS
# write, and no amount of Pull requests: write will authorise it.
#
# SO THE TOKEN NEEDS Contents: READ AND WRITE, plus Pull requests: read for the
# LIST call, plus the Metadata: read-only every fine-grained token carries.
#
# THE PREVIOUS REVISION REFUSED Contents: write on the grounds that "nothing here
# writes a file", and that is the reasoning being retracted: it confused the
# RUNNER with the API. This job checks nothing out and writes no file on disk,
# and the commit it asks GitHub to create lands in the repository all the same.
# Acting on that advice cannot clear the 403, because the permission it withholds
# is precisely the one the failing call requires.
#
# THE GRANT IS NOT FREE, AND SAYING SO IS PART OF THE CORRECTION. Contents: write
# on this repository is push access to a clinical system's source, carried by a
# repo secret. It is what GitHub requires for this endpoint and there is no
# narrower permission that covers it. If that trade is judged unacceptable, the
# honest alternative is to DELETE this workflow and update branches by hand -
# not to leave it installed with a token that cannot succeed.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: auto-update-prs
  cancel-in-progress: true

jobs:
  auto-update:
    name: Update open PR branches behind main
    runs-on: ubuntu-latest
    steps:
      - name: Update open, non-draft PRs that are behind main
        env:
          AUTO_UPDATE_TOKEN: ${{ secrets.AUTO_UPDATE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "${AUTO_UPDATE_TOKEN}" ]; then
            echo "AUTO_UPDATE_TOKEN secret not set, skipping. This workflow no-ops safely until the owner adds the PAT."
            exit 0
          fi

          # THE FAILURE MARKER IS A FILE, AND THAT IS NOT A STYLE CHOICE. The loop
          # below is the right-hand side of a pipe, so it runs in a SUBSHELL and
          # a shell variable set inside it does not survive to the end of the
          # step. A `failed=1` assignment would look like a fix, pass review, and
          # reproduce the exact defect it was written to remove.
          failed_marker="${RUNNER_TEMP:-/tmp}/auto-update-failed"
          rm -f "${failed_marker}"

          api() {
            curl -sS -w '\n%{http_code}' \
              -H "Authorization: token ${AUTO_UPDATE_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@"
          }

          # List open PRs (up to 100). Read-only.
          resp=$(api "https://api.github.com/repos/${REPO}/pulls?state=open&per_page=100")
          list_body=$(printf '%s' "${resp}" | sed '$d')
          list_code=$(printf '%s' "${resp}" | tail -n1)
          if [ "${list_code}" != "200" ]; then
            echo "Failed to list PRs (HTTP ${list_code}):"
            printf '%s\n' "${list_body}"
            exit 1
          fi

          # Emit one compact JSON object per open, non-draft PR targeting main.
          #
          # A PR LABELLED held-for-apply IS NEVER UPDATED. Owner ruling 2026-09-22.
          # A held migration PR is the branch an apply sitting runs from, detached
          # at a head it has just verified; merging main into it moves that head
          # under the sitting, and every such merge also spends a full CI cycle on
          # a PR that is parked by design. The label is the field a machine reads.
          # It goes on every held migration PR when it opens and comes off when
          # the PR arms, so an armed PR is updated as before. `.labels // []`
          # because a PR object without a labels array must mean "no label", not
          # a jq error that silently empties the whole pass.
          printf '%s' "${list_body}" \
            | jq -c '.[] | select(.draft == false) | select(.base.ref == "main") | {number, ref: .head.ref, label: .head.label, held: (((.labels // []) | map(.name) | index("held-for-apply")) != null)}' \
            | while read -r pr; do
                num=$(printf '%s' "${pr}" | jq -r '.number')
                ref=$(printf '%s' "${pr}" | jq -r '.ref')
                label=$(printf '%s' "${pr}" | jq -r '.label')
                held=$(printf '%s' "${pr}" | jq -r '.held')

                if [ "${held}" = "true" ]; then
                  echo "PR #${num} (${ref}): labelled held-for-apply - not updated, by rule."
                  continue
                fi

                # How far behind main is this PR's head?
                cmp=$(api "https://api.github.com/repos/${REPO}/compare/main...${label}")
                cmp_body=$(printf '%s' "${cmp}" | sed '$d')
                cmp_code=$(printf '%s' "${cmp}" | tail -n1)
                if [ "${cmp_code}" != "200" ]; then
                  # LEFT AS A SKIP DELIBERATELY, and named rather than fixed by
                  # reflex. A token that has lost write but kept read - the state
                  # this workflow was actually found in - still compares fine, and
                  # a token that has lost read entirely already exits 1 at the LIST
                  # call above. What is left here is the narrow case of one PR the
                  # compare cannot see, where failing the pass would be a new red
                  # for a benign reason. If that ever fires in practice, this is
                  # the line to revisit.
                  echo "PR #${num} (${ref}): compare failed (HTTP ${cmp_code}) - skipping."
                  continue
                fi

                behind=$(printf '%s' "${cmp_body}" | jq -r '.behind_by // 0')
                if [ "${behind}" = "0" ]; then
                  echo "PR #${num} (${ref}): up to date with main - nothing to do."
                  continue
                fi

                echo "PR #${num} (${ref}): behind main by ${behind} commit(s) - updating branch."
                upd=$(api -X PUT "https://api.github.com/repos/${REPO}/pulls/${num}/update-branch")
                upd_body=$(printf '%s' "${upd}" | sed '$d')
                upd_code=$(printf '%s' "${upd}" | tail -n1)
                case "${upd_code}" in
                  202)
                    echo "PR #${num} (${ref}): update queued."
                    ;;
                  422)
                    echo "PR #${num} (${ref}): could not auto-update (HTTP 422, most likely a merge conflict). Needs a human rebase."
                    printf '%s\n' "${upd_body}"
                    ;;
                  *)
                    # 404 lands here, and so does every other unexpected code.
                    # It still continues through the remaining PRs - one dead PR
                    # must not hide the others - but the pass is now a FAILURE.
                    echo "PR #${num} (${ref}): update failed (HTTP ${upd_code}) - continuing with the rest, but this pass FAILS."
                    printf '%s\n' "${upd_body}"
                    : > "${failed_marker}"
                    ;;
                esac
              done

          if [ -e "${failed_marker}" ]; then
            rm -f "${failed_marker}"
            echo "::error::At least one branch update FAILED (see the HTTP code above). Every open PR behind main now needs a manual Update branch, and main is protected with strict status checks, so each one costs a full CI cycle. If the code is 403 or 404 the AUTO_UPDATE_TOKEN cannot make this call - reissue it with Contents: read AND WRITE, plus Pull requests: read. update-branch merges the base branch into the head branch, so it writes a commit and needs Contents: write; a 403 body reading 'user doesn't have permission to update head repository' is that permission missing."
            exit 1
          fi

          echo "Auto-update pass complete."
