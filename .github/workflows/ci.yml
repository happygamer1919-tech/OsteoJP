name: CI

on:
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint + typecheck + test
    runs-on: ubuntu-latest
    steps:
      # FULL HISTORY, and the reconcile step at the bottom is why. When GitHub
      # rate-limits the installation token, that step reads merge state from git
      # history instead, and the default depth-1 clone holds one commit subject.
      # The script refuses a shallow clone with exit 2 rather than trusting it, so
      # without this line the rate limit stays fatal.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check migration journal
        run: pnpm db:check-journal

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Root-level scripts are not a workspace package, so `turbo run test` never
      # sees them. Without this step scripts/*.test.mjs would sit in the repo
      # looking like protection while running nowhere. Inside the existing
      # quality job on purpose: a separate job would be a new check name and
      # would not be in the REQUIRED set.
      - name: Test scripts
        run: pnpm test:scripts

      # THE SECRET SCANNER, AND WHY IT IS HERE RATHER THAN ONLY IN A HOOK.
      #
      # scripts/secret-scan.mjs has run since 2026-09-14 from
      # scripts/git-hooks/pre-push. A hook is not a control this repository
      # owns: git runs it only when `core.hooksPath` points at it, which is a
      # per-machine setting made by hand, per clone, and nothing verifies that
      # anyone has made it. A push from a machine that has not configured it is
      # scanned by nothing. Measured 2026-09-20: `grep -rn secret-scan .github/`
      # returned nothing, so CI had no view of this at all.
      #
      # INSIDE THIS JOB ON PURPOSE, for the same reason `Test scripts` above is:
      # a separate job is a separate check NAME, and a name that is not in the
      # REQUIRED set cannot block a merge until somebody adds it in the GitHub
      # UI. A step in a job that is already required blocks the moment it is red
      # and needs no owner click.
      #
      # THE base..head RANGE, not the default `origin/main...HEAD`: on a
      # pull_request event the checked-out ref is a merge commit, and these two
      # SHAs are the range GitHub itself says the PR covers. The checkout at the
      # top of this job sets `fetch-depth: 0`, which is what makes both
      # reachable - a shallow clone would diff nothing and pass having read
      # nothing, which is the vacuous-green shape this repo keeps rediscovering.
      #
      # Not piped and not `||`-guarded: the exit code IS the gate. A finding
      # names the file, the line, the pattern and the length, never the value.
      - name: Secret scan (added lines on this PR)
        run: node scripts/secret-scan.mjs --range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

      # Does the BOARD still agree with the repository? The validator next door
      # only asks whether it is well-formed. Four cards have now gone stale in the
      # same direction - work shipped, card still saying todo - and the fourth set
      # cost a dispatch that named already-shipped work as the next thing to build.
      #
      # In the existing quality job on purpose, for the reason the step above
      # already gives: a separate job would be a new check name and would not be
      # in the REQUIRED set. The PR rules need the API, so the token is passed;
      # the script exits 2 rather than 0 if it cannot reach it, because a check
      # that cannot ask must never report success.
      #
      # ONE RULED EXCEPTION (D2, 2026-09-19): a RATE-LIMIT 403 that survives the
      # retries falls back to merge state from git history, prints OFFLINE
      # FALLBACK and a ::warning, and still fails on a stale card. Any other
      # failure to reach the API, a token 403 included, is still exit 2.
      - name: Reconcile the board against merged PRs
        run: pnpm board:reconcile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
