name: CI

on:
  pull_request:
    branches: [main]

# A NEW PUSH CANCELS THE RUN IT SUPERSEDES. One group per PR, cancel only on
# pull_request events; any other run is grouped by its own run id, alone in its
# group, so nothing can cancel it. Same block in db-tests.yml, e2e.yml and
# openapi-drift.yml; the reasoning is in e2e.yml's header.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint + typecheck + test
    runs-on: ubuntu-latest
    steps:
      # FULL HISTORY, and the reconcile step at the bottom is why. When GitHub
      # rate-limits the installation token, that step reads merge state from git
      # history instead, and the default depth-1 clone holds one commit subject.
      # The script refuses a shallow clone with exit 2 rather than trusting it, so
      # without this line the rate limit stays fatal.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check migration journal
        run: pnpm db:check-journal

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Root-level scripts are not a workspace package, so `turbo run test` never
      # sees them. Without this step scripts/*.test.mjs would sit in the repo
      # looking like protection while running nowhere. Inside the existing
      # quality job on purpose: a separate job would be a new check name and
      # would not be in the REQUIRED set.
      - name: Test scripts
        run: pnpm test:scripts

      # ========================================================================
      # GATE FREEZE. A gate file may not move inside an ordinary pull request.
      # ========================================================================
      # SR-71 says a lane never edits a gate to pass its own PR, and it was
      # BREACHED TWICE on 2026-09-21 - once moving `.claude/skills/` out of a
      # HELD class, once widening an exemption inside a guard that runs in this
      # very job. A rule that lives only in prose is enforced by whoever
      # remembers it at the moment they are blocked. This is the mechanical
      # version.
      #
      # FIRST IN THE JOB WOULD BE WRONG. It sits after the tests on purpose: a
      # red here is about AUTHORITY, not correctness, and a contributor should
      # see whether their change WORKS before they are told they may not land it
      # this way.
      #
      # IN THIS JOB, not a new one, for the same reason `Test scripts` and the
      # secret scanner are: a separate job is a separate check NAME, and a name
      # nobody has added to the required set in the GitHub UI cannot block a
      # merge. A step in an already-required job blocks the moment it is red.
      #
      # THE TITLE AND BASE REF ARE PASSED IN rather than read from the git
      # checkout, because on a pull_request event HEAD is a merge commit and the
      # PR's own title is not in the repository at all. `fetch-depth: 0` at the
      # top of this job is what makes the three-dot diff work; the script FAILS
      # CLOSED if it cannot compute that diff rather than reporting a pass it
      # did not perform.
      - name: Gate freeze
        env:
          GATE_PR_TITLE: ${{ github.event.pull_request.title }}
          GATE_BASE_REF: ${{ github.base_ref }}
        run: node scripts/assert-gates-unchanged.mjs

      # A GATE-CHANGE pull request is merged BY THE OWNER, BY HAND. Auto-merge
      # on one would hand the decision back to CI, which is the thing the freeze
      # exists to take away from it.
      #
      # `|| true` ON THE READ AND NOT ON THE VERDICT: if `gh` cannot answer, the
      # step says so and PASSES, because a missing API answer is not evidence of
      # an armed PR - and the human merge is a second control on this same
      # thing. The verdict itself has no escape.
      - name: A GATE-CHANGE pull request is never armed
        if: startsWith(github.event.pull_request.title, 'GATE-CHANGE')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          ARMED=$(gh pr view "$PR" --json autoMergeRequest --jq 'if .autoMergeRequest == null then "no" else "yes" end' 2>/dev/null || echo "unknown")
          echo "auto-merge on #$PR: $ARMED"
          if [ "$ARMED" = "yes" ]; then
            echo "::error::This is a GATE-CHANGE pull request and auto-merge is ENABLED. Disable it. The owner merges gate changes by hand, which is the whole point of the freeze."
            exit 1
          fi
          if [ "$ARMED" = "unknown" ]; then
            echo "::warning::Could not read the auto-merge state, so it was NOT verified. The hand-merge rule still stands."
          fi

      # THE SECRET SCANNER, AND WHY IT IS HERE RATHER THAN ONLY IN A HOOK.
      #
      # scripts/secret-scan.mjs has run since 2026-09-14 from
      # scripts/git-hooks/pre-push. A hook is not a control this repository
      # owns: git runs it only when `core.hooksPath` points at it, which is a
      # per-machine setting made by hand, per clone, and nothing verifies that
      # anyone has made it. A push from a machine that has not configured it is
      # scanned by nothing. Measured 2026-09-20: `grep -rn secret-scan .github/`
      # returned nothing, so CI had no view of this at all.
      #
      # INSIDE THIS JOB ON PURPOSE, for the same reason `Test scripts` above is:
      # a separate job is a separate check NAME, and a name that is not in the
      # REQUIRED set cannot block a merge until somebody adds it in the GitHub
      # UI. A step in a job that is already required blocks the moment it is red
      # and needs no owner click.
      #
      # THE base..head RANGE, not the default `origin/main...HEAD`: on a
      # pull_request event the checked-out ref is a merge commit, and these two
      # SHAs are the range GitHub itself says the PR covers. The checkout at the
      # top of this job sets `fetch-depth: 0`, which is what makes both
      # reachable - a shallow clone would diff nothing and pass having read
      # nothing, which is the vacuous-green shape this repo keeps rediscovering.
      #
      # Not piped and not `||`-guarded: the exit code IS the gate. A finding
      # names the file, the line, the pattern and the length, never the value.
      - name: Secret scan (added lines on this PR)
        run: node scripts/secret-scan.mjs --range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

      # Does the BOARD still agree with the repository? The validator next door
      # only asks whether it is well-formed. Four cards have now gone stale in the
      # same direction - work shipped, card still saying todo - and the fourth set
      # cost a dispatch that named already-shipped work as the next thing to build.
      #
      # In the existing quality job on purpose, for the reason the step above
      # already gives: a separate job would be a new check name and would not be
      # in the REQUIRED set. The PR rules need the API, so the token is passed;
      # the script exits 2 rather than 0 if it cannot reach it, because a check
      # that cannot ask must never report success.
      #
      # ONE RULED EXCEPTION (D2, 2026-09-19): a RATE-LIMIT 403 that survives the
      # retries falls back to merge state from git history, prints OFFLINE
      # FALLBACK and a ::warning, and still fails on a stale card. Any other
      # failure to reach the API, a token 403 included, is still exit 2.
      - name: Reconcile the board against merged PRs
        run: pnpm board:reconcile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
