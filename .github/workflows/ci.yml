name: CI

on:
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint + typecheck + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check migration journal
        run: pnpm db:check-journal

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Root-level scripts are not a workspace package, so `turbo run test` never
      # sees them. Without this step scripts/*.test.mjs would sit in the repo
      # looking like protection while running nowhere. Inside the existing
      # quality job on purpose: a separate job would be a new check name and
      # would not be in the REQUIRED set.
      - name: Test scripts
        run: pnpm test:scripts
