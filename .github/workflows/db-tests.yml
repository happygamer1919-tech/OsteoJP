name: DB Tests

# Runs the packages/db RLS isolation vitest suites against a REAL, seeded Supabase
# stack with DATABASE_URL set, so they actually EXECUTE instead of self-skipping.
#
# Why this gate exists
#   The six RLS isolation suites all `describe.skipIf(!live)` where
#   live = Boolean(DATABASE_URL). ci.yml runs vitest with NO DATABASE_URL, so they
#   skip and report green; e2e.yml sets DATABASE_URL but runs only Playwright.
#   Net result before this workflow: the RLS proofs ran on ZERO PRs. This job boots
#   Supabase, applies migrations + base seed via `supabase db reset`, runs the
#   packages/db vitest suite with DATABASE_URL set, then runs a skip-guard that
#   turns the job RED if any of the six suites silently skips or collects zero
#   tests. A real RLS execution must be PROVABLE, not assumed.
#
# Separate from ci.yml (fast unit-only, no DB) and e2e.yml (Playwright + app).
# Deliberately uses a NON-privileged `supabase db reset` — the prod-equivalent
# migration apply. No privileged GRANT and no branch DB: the gate must hold under
# exactly what production runs.
#
# Skipping: PRs that touch only docs/markdown/excalidraw skip the Supabase boot
# entirely. The job still runs (so the branch-protection check is always reported)
# but exits green immediately with a skip notice.

on:
  pull_request:
    branches: [main]
  # Also run on push to main so the check registers as selectable in branch
  # protection and is proven green on the default branch.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rls:
    # Stable display name — wire branch protection to this exact string.
    name: DB-gated tests (RLS isolation, seeded DB)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        # Explicit `bash` (unlike the implicit default shell) enables pipefail, so
        # a failing `vitest ... | tee` cannot be masked by tee's exit 0. Without
        # this, a red RLS test soft-passes the DB gate (precedent PR #449).
        shell: bash

    env:
      # Local Supabase fixed default. The packages/db RLS suites connect ONLY
      # through this (owner/postgres role over TCP); they do not use the Supabase
      # JS client, ANON_KEY, or SERVICE_ROLE_KEY, so those are not captured here.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # W13-03a. A THROWAWAY FIXTURE, not a secret, and deliberately written in
      # the open so nobody mistakes it for one: it signs nothing that leaves this
      # runner and the database is destroyed with the job. It is here because the
      # apps/api DB-gated suite imports the OTP verify route, and that route
      # asserts the signing secret at BOOT rather than at the patient - so
      # without a value the suite cannot even be collected. The real value lives
      # in the osteojp-api Vercel project and never in this file.
      PATIENT_SESSION_SECRET: ci-fixture-not-a-secret-at-least-32-chars

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect whether code files changed
        id: changes
        run: |
          # On pull_request events compare against base branch.
          # On push to main always run.
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"
          echo "$CHANGED"
          # Skip only if EVERY changed file is docs/markdown/excalidraw/config
          NON_DOC=$(echo "$CHANGED" | grep -vE '^(docs/|.*\.(md|excalidraw)$)' || true)
          if [ -z "$NON_DOC" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

      # CI-docs-only-required-checks-skip. THE SKIP SAYS SO, OUT LOUD.
      #
      # This job is a REQUIRED check, so it has to report a conclusion on every
      # PR - which means a docs-only PR gets `pass` from a job that ran nothing.
      # That is correct (a database suite cannot be affected by a markdown diff)
      # and it READS WRONG: four green required checks look like four proofs,
      # and on a docs-only PR it is one proof and three abstentions. Until this
      # line the only tell was the DURATION - 6 seconds versus three minutes -
      # which nobody reads and no board note can be relied on to carry.
      #
      # `::notice::` puts it in the run's annotations, where a reviewer or a
      # session sees it without knowing to compare timings. The step summary
      # puts it on the run page. Same shape openapi-drift.yml already uses on
      # its own skip path; this brings the other two into line with it.
      #
      # A GENUINE `neutral` CONCLUSION WOULD BE BETTER AND IS NOT AVAILABLE
      # HERE. GitHub Actions has no supported way for a normal job to finish
      # neutral (exit 78 was removed), and reaching for a job-level `if:` skip
      # instead would change how branch protection sees this context - the one
      # experiment on this repo that can block every open PR at once if the
      # answer is not what was assumed. Not attempted. Recorded on the card.
      - name: Skip — docs-only PR
        if: steps.changes.outputs.code == 'false'
        run: |
          echo "::notice title=DB tests DID NOT RUN::Docs-only PR. This required check reports green WITHOUT having run the RLS suites. It is an abstention, not a proof."
          {
            echo "### DB-gated tests: SKIPPED, not passed"
            echo
            echo "Every changed file is docs/markdown, so the Supabase stack was never booted"
            echo "and no RLS suite ran. This check is green because it is REQUIRED and must"
            echo "report, not because anything was verified."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up pnpm
        if: steps.changes.outputs.code == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: Set up Node.js
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        if: steps.changes.outputs.code == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: v2.107.0

      - name: Start Supabase (lean stack)
        if: steps.changes.outputs.code == 'true'
        run: >
          supabase start
          -x analytics,vector,studio,realtime,storage,imgproxy,edge-runtime,functions,inbucket,meta

      - name: Apply migrations + base seed (supabase db reset)
        if: steps.changes.outputs.code == 'true'
        run: supabase db reset

      # SEC-function-owner-unpinned. Runs BEFORE the suites, because if the
      # ownership set is wrong every RLS assertion below is measuring something
      # other than what it claims to.
      #
      # WHAT IT CAN AND CANNOT CATCH HERE, stated so nobody mistakes a green run
      # for proof. `supabase db reset` builds this database with ONE principal
      # creating everything, so an owner SPLIT - the production failure - cannot
      # exist on a CI database and this step cannot detect it. What it DOES catch
      # is the COUNT: a fourteenth SECURITY DEFINER function landing without
      # being added to 0060 and to EXPECTED_COUNT. That is the reachable half,
      # and it is the half a PR can introduce.
      #
      # The owner half is enforced where it is enforceable: against production,
      # by the same script, in the apply block.
      - name: SECURITY DEFINER ownership + count (DATABASE_URL set)
        if: steps.changes.outputs.code == 'true'
        run: pnpm --filter @osteojp/db exec node scripts/check-security-definer-owner.mjs

      # fail-closed by owner ruling, never soft-pass
      - name: Run RLS isolation suite (DATABASE_URL set)
        if: steps.changes.outputs.code == 'true'
        working-directory: packages/db
        run: |
          pnpm exec vitest run \
            --reporter=default \
            --reporter=json --outputFile.json=rls-results.json \
            2>&1 | tee rls-run.log

      # W13-01a. The first DB-gated suite OUTSIDE packages/db. LOOP 1's DoD lines
      # assert properties of a TRANSACTION - that the appointment write and the
      # consumption record commit or roll back together, that a refusal still
      # writes an audit row, that the cutoff is re-evaluated at redemption - and
      # the code under test (redeemActionToken) lives in apps/web. It cannot move
      # into packages/db without inverting the dependency direction, so the suite
      # comes to the database instead: same Supabase stack, same DATABASE_URL,
      # its own vitest invocation and its own JSON report.
      - name: Run apps/web DB-gated suite (DATABASE_URL set)
        if: steps.changes.outputs.code == 'true'
        working-directory: apps/web
        # A GLOB, NOT A PATH LIST, and that is a fix rather than a tidy-up. This
        # step named redeem.db.test.ts explicitly, so pedido-confirm.db.test.ts
        # would have been added to the repo, passed review, and NEVER RUN - a
        # suite that reads as protection and executes nothing, which is the exact
        # defect class ACC-vacuous-guard-sweep was opened for. The apps/api step
        # below already globs; this one now matches it.
        run: |
          pnpm exec vitest run .db.test.ts \
            --reporter=default \
            --reporter=json --outputFile.json=web-db-results.json \
            2>&1 | tee web-db-run.log

      # W13-03. The second DB-gated suite outside packages/db, and here for the
      # same reason the apps/web one is: LOOP 3's remaining DoD lines assert
      # properties of the DATABASE - that one code cannot be claimed twice by two
      # REAL concurrent transactions, that the 30-day trusted-device boundary
      # holds as a SQL predicate, and that the claim's four writes commit
      # together. A mock racing itself proves the mock. The code under test is in
      # apps/api, which packages/db must not import from, so the suite comes to
      # the database.
      - name: Run apps/api DB-gated suites (DATABASE_URL set)
        if: steps.changes.outputs.code == 'true'
        working-directory: apps/api
        run: |
          pnpm exec vitest run .db.test.ts \
            --reporter=default \
            --reporter=json --outputFile.json=api-db-results.json \
            2>&1 | tee api-db-run.log

      # W13-03 NEGATIVE CONTROL, and it is here because the FIRST version of that
      # suite failed this exact check. A route-level "two simultaneous claims"
      # test passed with the consume guard hard-coded to true: on a fast local
      # database the first request commits before the second opens its
      # transaction, so the second is refused by findLive and the guard is never
      # reached. The test was measuring nothing and looked green.
      #
      # THE FLAG IS APPLIED BY PATCH, NOT BY AN ENV VAR, unlike A4's
      # A4_DISABLE_LOCK. A runtime switch that disables single-use enforcement on
      # the OTP claim path is not something that should exist in shipped auth
      # code at all, however carefully it defaults. The patch lives for the length
      # of this step and the file is restored before the next one.
      - name: W13-03 negative control - the race test MUST fail without the guard
        if: steps.changes.outputs.code == 'true'
        run: |
          perl -0pi -e 's/      return won\.length === 1;/      return true;/' apps/api/lib/auth/otp-store.ts
          if ! git diff --quiet -- apps/api/lib/auth/otp-store.ts; then
            echo "guard disabled for the control run"
          else
            echo "::error::the negative-control patch matched NOTHING - otp-store.ts changed shape and this control is no longer testing anything."
            exit 1
          fi
          set +e
          (cd apps/api && pnpm exec vitest run lib/auth/otp-claim.db.test.ts -t "THE RACE")
          code=$?
          set -e
          git checkout -- apps/api/lib/auth/otp-store.ts
          echo "guard disabled: exit=$code (expected NON-ZERO)"
          if [ "$code" -eq 0 ]; then
            echo "::error::The race test PASSED with the consume guard disabled. It is not detecting the race, so its normal green run proves nothing."
            exit 1
          fi

      - name: Assert RLS suites actually executed (skip-guard)
        if: steps.changes.outputs.code == 'true'
        run: >
          node .github/scripts/assert-rls-executed.mjs
          packages/db/rls-results.json
          apps/web/web-db-results.json
          apps/api/api-db-results.json
          packages/db/rls-run.log

      # A4 NEGATIVE CONTROL. The slot lock is the ONLY defence against an
      # unintended double-booking - the partial EXCLUDE constraint was cancelled
      # once a DB-gated test proved created_by cannot identify portal rows. So
      # the suite that proves the lock works must itself be proven capable of
      # failing. Run with the lock disabled, it MUST go red; if it stays green it
      # is not detecting the race and its normal green run means nothing.
      - name: A4 negative control - concurrency suite MUST fail without the lock
        if: steps.changes.outputs.code == 'true'
        working-directory: packages/db
        env:
          A4_DISABLE_LOCK: '1'
        run: |
          set +e
          pnpm exec vitest run tests/slot-lock-concurrency.test.ts --reporter=default
          code=$?
          set -e
          echo "A4_DISABLE_LOCK=1 exit=$code (expected NON-ZERO)"
          if [ "$code" -eq 0 ]; then
            echo "The concurrency suite PASSED with the slot lock disabled."
            echo "It is therefore not detecting the race, and its green run proves nothing."
            exit 1
          fi
          echo "Negative control OK: the suite detects the race."

      - name: Upload RLS report + log
        if: steps.changes.outputs.code == 'true' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: rls-report
          path: |
            packages/db/rls-results.json
            packages/db/rls-run.log
            apps/web/web-db-results.json
            apps/api/api-db-results.json
            apps/api/api-db-run.log
          retention-days: 7
